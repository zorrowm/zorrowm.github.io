<!doctype html><html><head><title>XGIS Mapshaper</title>
    <meta charset="utf-8" />
    <meta name="description" content="浏览器本地矢量数据浏览、拓扑简化与格式转换工作台" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />

    <!-- 1、异步加载JS -->
    <script async fetchpriority="high" src="SysConfig.js?t=1794622800838"></script>
    <script async src="js/geolocation.min.js"></script>
    <!-- 同步 -->
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <!-- 2、异步加载CSS:非重要的后期才使用，公用css部分 -->
    <link
      rel="preload"
      as="style"
      type="text/css"
      fetchpriority="low"
      href="css/quasar-table.css"
    />
    <!-- ── Favicons & Manifest ── -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" sizes="any" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- ── Fonts (self-hosted) ── -->
    <link
      rel="preload"
      href="fonts/PangMenZhengDao.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="img/wallpaper-lqip.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
      <script type="module" crossorigin src="./assets/index-CZ_znRFq.js"></script>
      <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-BCiCTKAo.js">
      <link rel="stylesheet" crossorigin href="./assets/style-DlJ6j1cU.css">
    </head><body>
    <div id="apploading" class="app-loading">
      <div class="app-loading-wrap">
        <div id="logo-part">
          <img src="img/logo.png" alt="Logo" id="waitLogo" />
          <img src="img/spinner.svg" alt="" id="waitSpinner" />
        </div>
        <div class="app-loading-title"> XGIS Mapshaper </div>
        <div id="app-loading-info">正在加载……</div>
      </div>
    </div>
